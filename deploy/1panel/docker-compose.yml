services:
  app:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: Dockerfile
    container_name: course-rag-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-course_rag}
      MYSQL_USER: ${MYSQL_USER:-course_rag}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      GUNICORN_BIND: 0.0.0.0:7860
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-17860}:7860"
    volumes:
      - ${PROJECT_ROOT}/storage:/app/storage
      - ${PROJECT_ROOT}/logs:/app/logs
      - ${PROJECT_ROOT}/data/course:/app/data/course
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/api/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  mysql:
    image: mysql:8.4
    container_name: course-rag-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-course_rag}
      MYSQL_USER: ${MYSQL_USER:-course_rag}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - course-rag-mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  course-rag-mysql-data:

