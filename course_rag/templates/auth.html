<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 - {{ app_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="auth-page">
    <div class="auth-shell">
        <section class="auth-layout">
            <div class="auth-copy">
                <p class="eyebrow">Welcome</p>
                <h1>课程问答助手</h1>
                <p class="hero-text">
                    登录后即可进入问答页面，查看自己的历史记录并上传自己的课程资料。
                </p>
            </div>

            <section class="auth-card auth-panel">
                <div class="auth-head">
                    <p class="panel-label">账号登录</p>
                    <span id="auth-badge" class="auth-badge">未登录</span>
                </div>
                <p id="auth-status" class="auth-status">请输入用户名和密码登录。若需新增账号，请联系管理员处理。</p>
                <form id="auth-form" class="auth-form">
                    <label class="sr-only" for="auth-username">用户名</label>
                    <input id="auth-username" name="username" type="text" maxlength="32" autocomplete="username" placeholder="用户名">
                    <label class="sr-only" for="auth-password">密码</label>
                    <input id="auth-password" name="password" type="password" minlength="6" autocomplete="current-password" placeholder="密码">
                    <div class="auth-actions">
                        <button id="login-button" class="secondary-button" type="submit">登录</button>
                    </div>
                </form>
            </section>
        </section>
    </div>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
